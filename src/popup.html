<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, "Microsoft YaHei", sans-serif; width: 280px; margin: 0; padding: 14px; color: #222; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button { flex: 1; cursor: pointer; border: 1px solid #d0d7de; background: #fff; border-radius: 6px; padding: 8px; font-size: 13px; }
    button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; }
    .msg { margin-top: 10px; font-size: 12px; color: #666; min-height: 16px; line-height: 1.5; }
    .url { word-break: break-all; color: #999; font-size: 11px; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>课程收藏夹进度追踪</h2>
  <div class="row">
    <button class="primary" id="updateBtn">立即更新本页收藏</button>
  </div>
  <div class="row">
    <button id="optionsBtn">设置规则</button>
  </div>
  <div class="msg" id="msg"></div>
  <div class="url" id="url"></div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
